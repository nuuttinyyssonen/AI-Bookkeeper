name: CI

on:
    pull_request:
    push:
        branches: ["main"]
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                    node-version: "24.14.0"
                    cache: "npm"
                    cache-dependency-path: server/package-lock.json
            
            - name: Start Postgres (docker compose)
              working-directory: server
              run: docker compose up -d
            
            - name: Wait for Postgres
              run: sleep 5
            
            - name: Install deps
              working-directory: server
              run: npm ci

            - name: Set up Google credentials
              run: |
                echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" | base64 --decode > /tmp/gcloud.json
                echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcloud.json" >> $GITHUB_ENV

            - name: server Jest tests
              working-directory: server
              env:
                DIRECT_URL: ${{ secrets.DIRECT_URL }}
                DATABASE_URL: ${{ secrets.DATABASE_URL }}
                DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
                SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
                SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                REDIS_URL: ${{ secrets.REDIS_URL }}
                CLIENT_URL: ${{ secrets.CLIENT_URL }}
                GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
                OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
                STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
                STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
                STRIPE_BASIC_PRICE_ID: ${{ secrets.STRIPE_BASIC_PRICE_ID }}
                STRIPE_PREMIUM_PRICE_ID: ${{ secrets.STRIPE_PREMIUM_PRICE_ID }}
                STRIPE_BASIC_YEARLY_PRICE_ID: ${{ secrets.STRIPE_BASIC_YEARLY_PRICE_ID }}
                STRIPE_PREMIUM_YEARLY_PRICE_ID: ${{ secrets.STRIPE_PREMIUM_YEARLY_PRICE_ID }}
                RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
                DELEGATE_IDENTIFIER: ${{ secrets.DELEGATE_IDENTIFIER }}
              run: npm test
            
            - name: Cleanup
              if: always()
              working-directory: server
              run: docker compose down -v
    
    e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                    node-version: "24.14.0"
                    cache: "npm"

            - name: Start Postgres
              working-directory: server
              run: docker compose up -d

            - name: Wait for Postgres
              run: sleep 5

            - name: Install deps
              run: |
                npm ci
                npm ci --prefix client
                npm ci --prefix server

            - name: Set up Google credentials
              run: |
                echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" | base64 --decode > /tmp/gcloud.json
                echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcloud.json" >> $GITHUB_ENV

            - name: Start servers
              env:
                DIRECT_URL: ${{ secrets.DIRECT_URL }}
                DATABASE_URL: ${{ secrets.DATABASE_URL }}
                DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
                SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
                SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                REDIS_URL: ${{ secrets.REDIS_URL }}
                CLIENT_URL: ${{ secrets.CLIENT_URL }}
                GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
                OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
                STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
                STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
                STRIPE_BASIC_PRICE_ID: ${{ secrets.STRIPE_BASIC_PRICE_ID }}
                STRIPE_PREMIUM_PRICE_ID: ${{ secrets.STRIPE_PREMIUM_PRICE_ID }}
                STRIPE_BASIC_YEARLY_PRICE_ID: ${{ secrets.STRIPE_BASIC_YEARLY_PRICE_ID }}
                STRIPE_PREMIUM_YEARLY_PRICE_ID: ${{ secrets.STRIPE_PREMIUM_YEARLY_PRICE_ID }}
                RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
                DELEGATE_IDENTIFIER: ${{ secrets.DELEGATE_IDENTIFIER }}
              run: |
                npm run dev:e2e --prefix server &
                npm run dev --prefix client &
                npx wait-on http://localhost:3000 http://localhost:5001

            - name: Run Cypress
              run: npx cypress run

            - name: Cleanup
              if: always()
              working-directory: server
              run: docker compose down -v